[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "morph-pde"
version = "0.1.0"
description = "MORPH: PDE Foundation Models with Arbitrary Data Modality"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}

authors = [
    {name = "MORPH developers"}
]

dependencies = [
    "torch>=2.4",
    "numpy",
    "h5py",
    "matplotlib",
    "tqdm",
    "netCDF4",
]


[project.optional-dependencies]
dev = [
    "build",
    "pytest",
]


[project.urls]
Repository = "https://github.com/lanl/MORPH"
Issues = "https://github.com/lanl/MORPH/issues"


[tool.setuptools.packages.find]
where = ["src"]
include = ["morph_pde*"]